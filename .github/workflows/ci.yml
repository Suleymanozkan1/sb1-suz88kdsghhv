# Every push and pull request: types, lint, unit tests and the integration tests against a real PostgreSQL.
# The audit (10/2026) could not tell whether the 490+ tests passed: nothing ran them automatically.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: hotelcost
          POSTGRES_PASSWORD: hotelcost
          POSTGRES_DB: hotelcost_test
          # not UTC on purpose: the migrations must pin the database to UTC themselves (month ends shifted before)
          TZ: Europe/Istanbul
          PGTZ: Europe/Istanbul
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hotelcost"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://hotelcost:hotelcost@localhost:5432/hotelcost_test?schema=public
      DATABASE_URL: postgresql://hotelcost:hotelcost@localhost:5432/hotelcost_test?schema=public
      SESSION_SECRET: ci-only-session-secret-not-used-anywhere-else
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Embedded VBA sources are in sync
        run: npx tsx scripts/gen-vba.ts && git diff --exit-code src/server/excel/vba-sources.generated.ts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:integration
      - name: Schema and migrations agree (no un-migrated schema change)
        run: |
          PGPASSWORD=hotelcost psql -h localhost -U hotelcost -d hotelcost_test -c "CREATE DATABASE hotelcost_shadow"
          npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma --shadow-database-url postgresql://hotelcost:hotelcost@localhost:5432/hotelcost_shadow --exit-code
      - name: Production build (RSC / client boundaries, route exports)
        run: npm run build
      - name: No critical vulnerability in runtime dependencies
        run: npm audit --omit=dev --audit-level=critical
